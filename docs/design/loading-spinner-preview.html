<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loading Spinner Preview</title>
    <style>
      :root {
        --spinner-color: #b0b4ba;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #272a2d;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .preview {
        display: grid;
        gap: 24px;
        justify-items: center;
      }

      .sample {
        width: 120px;
        height: 80px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: #ffffff;
        border: 1px solid #edeef0;
      }

      .loader {
        width: 24px;
        padding: 4px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--spinner-color);
        --_m:
          conic-gradient(#0000 10%, #000),
          linear-gradient(#000 0 0) content-box;
        -webkit-mask: var(--_m);
        mask: var(--_m);
        -webkit-mask-composite: source-out;
        mask-composite: subtract;
        animation: spin 1s infinite linear;
      }

      .label {
        font-size: 13px;
        color: #777b84;
      }

      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="sample">
        <div class="loader" aria-label="로딩 중"></div>
      </div>
      <div class="label">#3 / gray10 #B0B4BA / 24x24px</div>
    </main>
  </body>
</html>
